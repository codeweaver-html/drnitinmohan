<div id="site-footer-mount"></div>\n<button class="floating-booking" id="floating-booking" type="button" hidden aria-label="Book via WhatsApp">Book via WhatsApp</button>\n<button class="back-to-top" id="back-to-top" type="button" hidden>Back to top ↑</button>\n<div class="scroll-progress" id="scroll-progress" aria-hidden="true" hidden></div>
<dialog class="kg-rb-booking-dialog" id="kg-rb-booking-dialog" aria-labelledby="kg-rb-booking-heading"><form id="booking-form" class="booking-form" novalidate>
<div class="booking-head"><div><p class="site-eyebrow">WhatsApp appointment</p><h2 id="kg-rb-booking-heading">Appointment details</h2></div><button type="button" class="dialog-close" data-close-booking aria-label="Close appointment form">×</button></div>
<div class="booking-fields"><label>Child’s name<input id="booking-child-name" name="childName" type="text" autocomplete="name" required></label><label>Child’s age<input id="booking-child-age" name="childAge" type="number" min="0" max="18" step="0.1" required><span>years</span></label><label>Phone Number<input id="booking-phone" name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" required></label><label>Preferred date<input id="booking-date" name="date" type="date" required><small>Choose today or a future date.</small></label><label>Preferred time (30-minute slots)<select id="booking-time" name="time" required disabled><option value="">Select a date first to see available 30-minute appointment slots.</option></select></label></div>
<p class="captcha-disclosure">This site is protected by reCAPTCHA. Google <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms of Service</a> apply.</p><p id="booking-error" class="site-status" aria-live="polite"></p><div id="recaptcha-slot" aria-hidden="true"></div><div class="booking-actions"><button type="button" class="site-button site-button-secondary" data-close-booking>Cancel</button><button type="submit" class="site-button site-button-primary" id="booking-submit">Continue to WhatsApp</button></div>
</form></dialog>\n<div class="image-viewer" id="image-viewer" hidden role="dialog" aria-modal="true" aria-label="Image viewer"><button class="viewer-prev" type="button" aria-label="Previous image">‹</button><button class="viewer-next" type="button" aria-label="Next image">›</button><button class="viewer-close" type="button" aria-label="Close image viewer">×</button><button class="viewer-zoom-out" type="button" aria-label="Zoom out">−</button><button class="viewer-reset" type="button">Reset</button><button class="viewer-zoom-in" type="button" aria-label="Zoom in">+</button><img alt="" src=""></div>
