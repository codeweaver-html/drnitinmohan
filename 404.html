
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | KidsGastro</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0759a8">

  <link rel="icon" href="/assets/kg%20logo.webp" type="image/webp">

  <style>
    :root {
      --blue: #0759a8;
      --deep-blue: #064b8d;
      --yellow: #ffc400;
      --text: #183047;
      --muted: #647589;
      --background: #f5f8fc;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    /* Header */
    .site-header {
      flex: 0 0 auto;
      width: 100%;
      min-height: 76px;
      display: flex;
      align-items: center;
      padding: 12px 6%;
      background: var(--blue);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      background: var(--white);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
    }

    /* Precisely centred main section */
    main {
      flex: 1 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .error-content {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 42px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(16, 56, 94, 0.07);
    }

    .error-code {
      display: block;
      width: 100%;
      margin: 0;
      color: var(--blue);
      font-size: clamp(76px, 15vw, 120px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -5px;
      text-align: center;
    }

    h1 {
      display: block;
      width: 100%;
      margin: 22px 0 12px;
      color: var(--deep-blue);
      font-size: clamp(23px, 4vw, 31px);
      line-height: 1.3;
      font-weight: 700;
      text-align: center;
    }

    .message {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      text-align: center;
    }

    /* Button */
    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin: 0 auto;
      padding: 13px 25px;
      border: 2px solid var(--yellow);
      border-radius: 8px;
      background: var(--yellow);
      color: #172b3e;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .home-button:hover {
      background: #ffd43b;
      transform: translateY(-2px);
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);
    }

    .home-button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    /* Footer */
    .site-footer {
      flex: 0 0 auto;
      width: 100%;
      padding: 20px 16px;
      background: var(--deep-blue);
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      text-align: center;
    }

    .site-footer p {
      margin: 0;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .site-header {
        min-height: 66px;
        padding: 10px 5%;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand-name {
        font-size: 18px;
      }

      main {
        padding: 28px 16px;
      }

      .error-content {
        padding: 38px 20px;
        border-radius: 14px;
      }

      .message {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="brand"
       href="https://drnitinmohan.com/"
       aria-label="KidsGastro home">

      <img
        src=""assets\kg logo.webp""
        alt="Dr. Nitin Mohan KidsGastro logo">

      <span class="brand-name">KidsGastro</span>
    </a>
  </header>

  <main>
    <section class="error-content" aria-labelledby="error-heading">

      <p class="error-code" aria-label="Error 404">404</p>

      <h1 id="error-heading">
        We couldn’t find this page.
      </h1>

      <p class="message">
        It may have moved or the link may be incorrect.
      </p>

      <a class="home-button" href="https://drnitinmohan.com/">
        Back to drnitinmohan.com
      </a>

    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 KidsGastro. All rights reserved.</p>
  </footer>

</body>
</html>
