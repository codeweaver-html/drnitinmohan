<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#005EB8">
  <title>Opening KidsGastro page…</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:#f6f9fc; color:#18384d; font:16px/1.6 Arial,sans-serif; text-align:center; }
    main { width:min(560px,100%); padding:30px; border-radius:18px; background:#fff; box-shadow:0 12px 36px rgba(9,52,91,.1); }
    a { color:#005EB8; font-weight:700; }
  </style>
</head>
<body>
  <main><h1>Opening this KidsGastro page…</h1><p id="route-status">Please wait while the page loads.</p><p><a href="/">Return to KidsGastro home</a></p></main>
  <script>
    (async function () {
      const allowed = new Set(["about", "admin", "blog", "clinic", "clinical", "faqs", "gallery", "latest", "newsletter", "publications", "services", "socials", "testimonials", "treatments", "updates"]);
      const status = document.getElementById("route-status");
      let slug = "";
      try { slug = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").toLowerCase(); }
      catch (_) { slug = ""; }
      const legacyMatch = location.pathname.match(/^\/([a-z0-9-]+)\.html$/i);
      if (legacyMatch && allowed.has(legacyMatch[1].toLowerCase())) {
        location.replace("/" + legacyMatch[1].toLowerCase() + "/" + location.search + location.hash);
        return;
      }
      if (!allowed.has(slug)) {
        status.textContent = "This page could not be found.";
        return;
      }
      try {
        const response = await fetch("/" + encodeURIComponent(slug) + ".html", { cache: "no-store" });
        if (!response.ok) throw new Error("The root page file was not found.");
        let markup = await response.text();
        if (!/<base\s/i.test(markup)) {
          markup = markup.replace(/<head([^>]*)>/i, '<head$1><base href="/">');
        }
        document.open();
        document.write(markup);
        document.close();
      } catch (_) {
        status.textContent = "The page file is not available yet. Please use the main navigation or return home.";
      }
    })();
  </script>
</body>
</html>
