<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0759a8">
  <link rel="icon" href="./favicon.ico" sizes="any" type="image/x-icon">
  <link rel="apple-touch-icon" href="./assets/kg%20logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style-shared.css">
  <title>Authorised Access | KidsGastro</title>
  <style>
    :root { --kg-admin-blue:#0759a8; --kg-admin-navy:#0b347e; --kg-admin-yellow:#ffc400; }
    body.kg-admin-login { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(145deg,#edf5fc,#f8fbff 58%,#eaf2fa); }
    .admin-shell { width:min(100%,480px); }
    #gate { position:relative; overflow:hidden; padding:clamp(25px,5vw,42px); border:1px solid #dbe6ef; border-radius:22px; background:#fff; box-shadow:0 24px 68px rgba(11,52,126,.13); }
    #gate::before { content:""; position:absolute; inset:0 0 auto; height:7px; background:linear-gradient(90deg,var(--kg-admin-yellow) 0 24%,var(--kg-admin-blue) 24% 100%); }
    .admin-brand { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
    .admin-brand img { width:58px; height:58px; object-fit:contain; }
    .brand-title { display:block; color:var(--kg-admin-navy); font-size:1.03rem; font-weight:800; line-height:1.3; }
    .brand-caption { display:block; margin-top:3px; color:#6a7e91; font-size:.69rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .access-label { display:inline-flex; align-items:center; gap:8px; margin:0 0 12px; color:var(--kg-admin-blue); font-size:.7rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .access-dot { width:8px; height:8px; border-radius:50%; background:#18865b; box-shadow:0 0 0 4px #e8f5ef; }
    h1 { margin:0; color:var(--kg-admin-navy); font-size:clamp(1.7rem,5vw,2.1rem); letter-spacing:-.04em; line-height:1.15; }
    .login-intro { margin:8px 0 20px; color:#617587; font-size:.88rem; }
    .field { display:grid; gap:7px; margin-top:17px; }
    .field label { color:#29485f; font-size:.82rem; font-weight:700; }
    .input-wrap { position:relative; }
    .field input { width:100%; min-height:50px; padding:11px 14px; border:1px solid #cad9e5; border-radius:10px; background:#fbfdff; color:#18384d; font:inherit; font-size:.92rem; }
    .field input:focus { outline:3px solid rgba(7,89,168,.13); border-color:var(--kg-admin-blue); background:#fff; }
    #passphrase { padding-right:76px; }
    #toggle-password { position:absolute; top:50%; right:9px; transform:translateY(-50%); padding:7px 9px; border:0; border-radius:7px; background:transparent; color:var(--kg-admin-blue); font:inherit; font-size:.77rem; font-weight:800; cursor:pointer; }
    #unlock { display:flex; width:100%; min-height:51px; align-items:center; justify-content:center; gap:10px; margin-top:23px; padding:12px 18px; border:0; border-radius:10px; background:var(--kg-admin-blue); color:#fff; font:inherit; font-size:.91rem; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(7,89,168,.18); transition:transform .18s,background .18s,box-shadow .18s; }
    #unlock:hover { transform:translateY(-1px); background:#064b8d; box-shadow:0 11px 24px rgba(7,89,168,.22); }
    #unlock:disabled { opacity:.65; cursor:wait; transform:none; }
    #error { min-height:1.4em; margin:12px 0 0; color:#b42318; font-size:.79rem; }
    #gate.is-error { border-color:#e4aaa6; animation:kg-shake .32s ease; }
    #gate.is-success { border-color:#a9d6bc; }
    #gate.is-success .access-dot { background:#18865b; box-shadow:0 0 0 5px #e8f5ef; }
    .login-foot { display:flex; justify-content:center; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid #edf1f5; color:#718397; font-size:.71rem; text-align:center; }
    .login-foot svg { width:15px; height:15px; flex:0 0 15px; }
    .login-note { margin:14px 0 0; color:#718397; font-size:.72rem; text-align:center; }
    .admin-home { display:inline-block; margin:17px 0 0; color:var(--kg-admin-blue); font-size:.82rem; font-weight:700; text-decoration:underline; text-underline-offset:4px; }
    @keyframes kg-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }
    @media(max-width:520px) { body.kg-admin-login { padding:14px; } #gate { border-radius:17px; } .admin-brand { margin-bottom:28px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body class="kg-admin-login">
  <main class="admin-shell">
    <section id="gate" aria-labelledby="admin-title">
      <div class="admin-brand">
        <img src="./assets/kg%20logo.webp" alt="KidsGastro logo" width="58" height="58">
        <div><span class="brand-title">KidsGastro</span><span class="brand-caption">Admin</span></div>
      </div>
      
      <h1 id="admin-title">Admin sign-in</h1>
      <p class="login-intro">Sign in to manage website updates.</p>
      <form id="unlock-form" novalidate>
        <div class="field">
          <label for="login-id">Login ID</label>
          <input id="login-id" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Login ID" required>
        </div>
        <div class="field">
          <label for="passphrase">Password</label>
          <div class="input-wrap">
            <input id="passphrase" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Password" required>
            <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button id="unlock" type="submit"><span class="button-label">Sign in</span><span aria-hidden="true" class="button-arrow">→</span></button>
        <p id="error" role="alert" aria-live="polite"></p>
      </form>
      <div class="login-foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <span>Secure session · 15 minutes</span>
      </div>
      
    </section>
    <p style="text-align:center"><a class="admin-home" href="./index.html">← Return to KidsGastro website</a></p>
  </main>
  <script>
  (function () {
    "use strict";
    const SESSION_KEY = "kg_admin_authenticated_until";
    const SESSION_MS = 15 * 60 * 1000;
    const payload = {"salt":"3arnF/r65BC2oU2iFS3Szw==","iv":"6acdZIH+cVZxsLY7","ciphertext":"NNPOIXfqdatQxTPzVeHHYFYBlAESZI7FJaZc+R39ESX5iv8dQT0dv7Q09sbB0UJXbZIiwFH47Yb4tswP08yhCmcq213swmKEiJEEhrlm4DIFEyVZqULlMsyIvFWwbMdx3JY0gC727NqJvuIvIGS9ZEnjYvMPgV6Hn4oJcfs8sDJATXT7v2DH9yHE+NfcaPpdovTRoJpm1y+87TD9ZUSwQ7aPkGZ0jQfWrUuzdnjcXDvO+woqGdEsjiRM6D3V5kdRbmSEgXo3xNxUiujdlZpXZmTT08nWULoFf6dkB4+qTJ+HrlcZA0s9A/kUIBQEtL4WSVW2QfkjHski1PJlil74rUIBIxgOmB2pASUCov1Sl4LmgI52M+ogSCAOLRjUI9CdRgzkAO4mdnWzWlEOW+deEMsHzmXGgcZxgQNLawNxzbkuHCt/O84dw/va/DnKVjZFJC3vKfpKlMWA28e1vSKH2EibbfQ6u87sK1uqTZmdG1lntLNingeyIstMpAGmltmGFSTR3ej7JpUiPAblpMZEXAMB6lxhSeh3OgR+EW8pJPA+5txeBIfS92cMbMI1JSk6MpDegHLQgeraL5+q0nnc8QMuusNcDXfaCL88QWrFJeHdG84IgL7gyOgGeMcMvOweVN31dGCQctDFieXxJRpA55wHauwV3mE4hn/8u0nTB5Rz11YHtRFS8KFT7mBaTWtGZqKDufVrt261JRo7XLDrEyrzHYDtHQzU0HZqG0CqnX7tTHWg0TaZp+1T68kvSv8hEL0S76X9SDMTdbEofQtHVWQrhoNeMRVI+yTqelpxk8Ax93gyNEApajAIaRZ4WNYlqT+odY5vx0rBju16xlUEjfncq8SmRagur25/amR7TahZvBKsbsvAse4p1nR7ZxVkcRN5ucqUq8RlV55oR4gXwd0aSWF7RxQHHqweFRzIZe+5aX2y5haxMRnPu4O2/JNis6tJF5E+7LxkwZfCymlF0OhTUi/QFd1FH4OtbMe2xLy5n+8xZebQ9oVRiUh5yBvZACNZfDrZe4RH/w8+aUvZhTe8zmZ6Idx65gq/uwEegspb46pb6NKEA772rAAB7gAgoE9j7fyQ17V15Z8o+OGJozWg4Bnu+m15y1T7ySAImqX4up1SydUw/nL7zaqFVSa21tA691RF2pKREgHAsMbeLlNuk6J/+8s98EueEPtW0QGwjXs9CMGBHkV5JRQzlUBvaqdn0/AlfrPAwDVjHdCnPIC0mJKnLYrNKUwpWd1i1U7LDqGCE/dbKdzXdg==","iterations":310000};
    const form = document.getElementById("unlock-form");
    const idInput = document.getElementById("login-id");
    const passwordInput = document.getElementById("passphrase");
    const toggle = document.getElementById("toggle-password");
    const gate = document.getElementById("gate");
    const button = document.getElementById("unlock");
    const buttonLabel = button.querySelector(".button-label");
    const buttonArrow = button.querySelector(".button-arrow");
    const error = document.getElementById("error");
    let submitting = false;

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }
    function maskPassword() {
      if (passwordInput.type !== "text") return;
      passwordInput.type = "password";
      toggle.textContent = "Show";
      toggle.setAttribute("aria-label", "Show password");
      toggle.setAttribute("aria-pressed", "false");
    }
    function goToEditor() {
      const params = new URLSearchParams(location.search);
      const requested = params.get("return");
      let destination = new URL("./updates.html", location.href);
      if (requested) {
        try {
          const parsed = new URL(requested, location.origin);
          if (parsed.origin === location.origin && parsed.pathname.replace(/\/+$/, "").toLowerCase() === "/updates.html") destination = parsed;
        } catch (_) { /* Use the fixed editor destination. */ }
      }
      location.replace(destination.href);
    }

    try {
      const existingExpiry = Number(sessionStorage.getItem(SESSION_KEY));
      if (Number.isFinite(existingExpiry) && existingExpiry > Date.now()) goToEditor();
    } catch (_) { /* Storage disabled: allow a fresh sign-in attempt. */ }

    toggle.addEventListener("click", function () {
      const reveal = passwordInput.type === "password";
      passwordInput.type = reveal ? "text" : "password";
      toggle.textContent = reveal ? "Hide" : "Show";
      toggle.setAttribute("aria-label", reveal ? "Hide password" : "Show password");
      toggle.setAttribute("aria-pressed", String(reveal));
    });
    passwordInput.addEventListener("blur", maskPassword);
    [idInput, passwordInput].forEach(field => field.addEventListener("input", function () {
      gate.classList.remove("is-error", "is-success");
      error.textContent = "";
    }));

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (submitting) return;
      if (!window.crypto || !crypto.subtle) {
        error.textContent = "Secure sign-in requires HTTPS. Open this page from the published website.";
        return;
      }
      submitting = true;
      gate.classList.remove("is-error", "is-success");
      error.textContent = "";
      button.disabled = true;
      buttonLabel.textContent = "Verifying…";
      buttonArrow.textContent = "";
      try {
        const credential = idInput.value.trim() + ":" + passwordInput.value;
        if (!idInput.value.trim() || !passwordInput.value) throw new Error("invalid");
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(credential), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:decodeBase64(payload.salt), iterations:payload.iterations, hash:"SHA-256" },
          material, { name:"AES-GCM", length:256 }, false, ["decrypt"]
        );
        /* Successful authenticated decryption validates the existing credential pair. */
        await crypto.subtle.decrypt(
          { name:"AES-GCM", iv:decodeBase64(payload.iv) }, key, decodeBase64(payload.ciphertext)
        );
        gate.classList.add("is-success");
        buttonLabel.textContent = "Access granted";
        buttonArrow.textContent = "✓";
        sessionStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_MS));
        idInput.value = "";
        passwordInput.value = "";
        window.setTimeout(goToEditor, 300);
      } catch (_) {
        gate.classList.remove("is-success");
        gate.classList.add("is-error");
        error.textContent = "Incorrect Login ID or password. Please try again.";
        passwordInput.value = "";
        maskPassword();
        passwordInput.focus();
        buttonLabel.textContent = "Try again";
        buttonArrow.textContent = "→";
      } finally {
        button.disabled = false;
        submitting = false;
        if (!gate.classList.contains("is-success")) buttonLabel.textContent = "Sign in securely";
      }
    });
  })();
  </script>
</body>
</html>
