<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0759a8">
<title>Authorised Access | KidsGastro</title>
<link rel="icon" href="/assets/logo%20kg.webp" type="image/webp">
<style>
:root{font-family:Arial,"Segoe UI",sans-serif;color:#17324d;background:#f3f7fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eaf3f9,#f7fbff)}
#gate{width:min(100%,480px);padding:32px 28px;background:#fff;border:1px solid #d8e4ef;box-shadow:0 10px 30px rgba(18,58,93,.08);text-align:center}
.authorised-message{margin:0 0 22px;color:#0759a8;font-size:1.35rem;font-weight:800}
#login-id,#passphrase{display:block;width:100%;margin-top:11px;padding:13px 14px;border:1px solid #aebfd0;border-radius:6px;font:inherit;color:#17324d;background:#fff}
#unlock{display:block;width:100%;margin-top:13px;padding:13px 16px;border:0;border-radius:6px;background:#0759a8;color:#fff;font:700 1rem Arial,sans-serif;cursor:pointer}
#unlock:disabled{opacity:.65;cursor:wait}
#error{min-height:1.4em;margin:12px 0 0;color:#b42318;font-size:.9rem}
#content{width:100%}
.admin-shell{width:min(100%,560px);margin:auto}
.admin-brand{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:#0759a8;font-weight:800}
.admin-brand img{width:54px;height:54px;object-fit:contain}
.admin-brand span small{display:block;color:#52677a;font-weight:500;font-size:.78rem;margin-top:3px}
#kg-admin-portal{padding:30px 26px;border:1px solid #d8e4ef;background:#fff;color:#17324d;box-shadow:0 10px 30px rgba(18,58,93,.08)}
#kg-admin-portal .authorised-message{color:#0759a8}
#kg-admin-portal p{line-height:1.55}
.kg-admin-action{display:inline-flex;align-items:center;justify-content:center;margin:14px 8px 0 0;padding:11px 16px;border-radius:6px;background:#0759a8;color:#fff!important;font-weight:700;text-decoration:none}
.admin-back{display:inline-block;margin:18px 0 0;color:#0759a8;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media(max-width:520px){body{padding:16px}#gate{padding:26px 20px}#kg-admin-portal{padding:24px 18px}}
</style>
</head>
<body>
<section id="gate" aria-label="Authorised access">
  <p class="authorised-message">Authorised access only.</p>
  <form id="unlock-form">
    <label for="login-id" style="position:absolute;left:-9999px">Login ID</label>
    <input id="login-id" type="text" autocomplete="username" placeholder="Login ID" required>
    <label for="passphrase" style="position:absolute;left:-9999px">Password</label>
    <input id="passphrase" type="password" autocomplete="current-password" placeholder="Password" required>
    <button id="unlock" type="submit">Login</button>
    <p id="error" role="alert" aria-live="polite"></p>
  </form>
</section>
<div id="content" hidden></div>
<script>
(function(){
"use strict";
const payload={"salt":"3arnF/r65BC2oU2iFS3Szw==","iv":"6acdZIH+cVZxsLY7","ciphertext":"NNPOIXfqdatQxTPzVeHHYFYBlAESZI7FJaZc+R39ESX5iv8dQT0dv7Q09sbB0UJXbZIiwFH47Yb4tswP08yhCmcq213swmKEiJEEhrlm4DIFEyVZqULlMsyIvFWwbMdx3JY0gC727NqJvuIvIGS9ZEnjYvMPgV6Hn4oJcfs8sDJATXT7v2DH9yHE+NfcaPpdovTRoJpm1y+87TD9ZUSwQ7aPkGZ0jQfWrUuzdnjcXDvO+woqGdEsjiRM6D3V5kdRbmSEgXo3xNxUiujdlZpXZmTT08nWULoFf6dkB4+qTJ+HrlcZA0s9A/kUIBQEtL4WSVW2QfkjHski1PJlil74rUIBIxgOmB2pASUCov1Sl4LmgI52M+ogSCAOLRjUI9CdRgzkAO4mdnWzWlEOW+deEMsHzmXGgcZxgQNLawNxzbkuHCt/O84dw/va/DnKVjZFJC3vKfpKlMWA28e1vSKH2EibbfQ6u87sK1uqTZmdG1lntLNingeyIstMpAGmltmGFSTR3ej7JpUiPAblpMZEXAMB6lxhSeh3OgR+EW8pJPA+5txeBIfS92cMbMI1JSk6MpDegHLQgeraL5+q0nnc8QMuusNcDXfaCL88QWrFJeHdG84IgL7gyOgGeMcMvOweVN31dGCQctDFieXxJRpA55wHauwV3mE4hn/8u0nTB5Rz11YHtRFS8KFT7mBaTWtGZqKDufVrt261JRo7XLDrEyrzHYDtHQzU0HZqG0CqnX7tTHWg0TaZp+1T68kvSv8hEL0S76X9SDMTdbEofQtHVWQrhoNeMRVI+yTqelpxk8Ax93gyNEApajAIaRZ4WNYlqT+odY5vx0rBju16xlUEjfncq8SmRagur25/amR7TahZvBKsbsvAse4p1nR7ZxVkcRN5ucqUq8RlV55oR4gXwd0aSWF7RxQHHqweFRzIZe+5aX2y5haxMRnPu4O2/JNis6tJF5E+7LxkwZfCymlF0OhTUi/QFd1FH4OtbMe2xLy5n+8xZebQ9oVRiUh5yBvZACNZfDrZe4RH/w8+aUvZhTe8zmZ6Idx65gq/uwEegspb46pb6NKEA772rAAB7gAgoE9j7fyQ17V15Z8o+OGJozWg4Bnu+m15y1T7ySAImqX4up1SydUw/nL7zaqFVSa21tA691RF2pKREgHAsMbeLlNuk6J/+8s98EueEPtW0QGwjXs9CMGBHkV5JRQzlUBvaqdn0/AlfrPAwDVjHdCnPIC0mJKnLYrNKUwpWd1i1U7LDqGCE/dbKdzXdg==","iterations":310000};
const form=document.getElementById("unlock-form");
const idInput=document.getElementById("login-id");
const input=document.getElementById("passphrase");
const button=document.getElementById("unlock");
const error=document.getElementById("error");
const gate=document.getElementById("gate");
const content=document.getElementById("content");
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
form.addEventListener("submit",async function(event){
 event.preventDefault();error.textContent="";button.disabled=true;button.textContent="Checking…";
 try{
   const credential=idInput.value.trim()+":"+input.value;
   const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(credential),"PBKDF2",false,["deriveKey"]);
   const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(payload.salt),iterations:payload.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
   const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(payload.iv)},key,fromB64(payload.ciphertext));
   /* Successful credential verification: tab-scoped 15-minute session. */
   sessionStorage.setItem("kg_admin_authenticated_until", String(Date.now() + 15 * 60 * 1000));
   idInput.value="";input.value="";
   const params = new URLSearchParams(location.search);
   const requested = params.get("return");
   if (requested) {
     /* Redirected login: accept only the site's known updates editor. */
     let returnTo = "/updates.html";
     try {
       const parsed = new URL(requested, location.origin);
       if (parsed.origin === location.origin &&
           parsed.pathname.replace(/\/+$/, "").toLowerCase() === "/updates.html") {
         returnTo = parsed.pathname + parsed.search + parsed.hash;
       }
     } catch (_) {}
     location.replace(returnTo);
   } else {
     /* Standalone login: preserve the original admin portal experience. */
     content.innerHTML = new TextDecoder().decode(plain);
     gate.hidden = true;
     content.hidden = false;
   } }catch(e){
   error.textContent="Incorrect Login ID or password. Please try again.";
   input.value="";input.focus();
 }finally{button.disabled=false;button.textContent="Login";}
});
})();
</script>

<script>
(function () {
  "use strict";
  document.addEventListener("contextmenu", function (event) {
    event.preventDefault();
  }, true);
})();
</script>

</body>
